<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haptic Air</title>

<style>
:root {
    --bg:#0f172a;
    --card:#111827;
    --text:#e5e7eb;
    --sub:#9ca3af;
    --accent:#2563eb;
}
.light {
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#111827;
    --sub:#6b7280;
}
body {
    margin:0;
    font-family:Segoe UI, Arial;
    background:var(--bg);
    color:var(--text);
}
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:var(--card);
}
.logo {
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}
.main {
    max-width:1000px;
    margin:30px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}
.card {
    background:var(--card);
    padding:20px;
    border-radius:12px;
}
.os-select button {
    margin:4px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#374151;
    color:white;
}
.os-select .active {
    background:var(--accent);
}
.download-btn {
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:white;
}
.bar {
    height:10px;
    background:#1f2937;
    border-radius:6px;
    overflow:hidden;
}
.fill {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
}
.progress-box {display:none;margin-top:15px;}
.small {font-size:12px;color:var(--sub);}
.ad {
    background:linear-gradient(135deg,#1d4ed8,#9333ea);
    padding:20px;
    border-radius:12px;
    color:white;
    text-align:center;
}
</style>
</head>

<body>

<header>
<div class="logo">
<!-- SVG LOGO -->
<svg width="28" height="28" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="45" fill="#2563eb"/>
<path d="M30 60 Q50 20 70 60" stroke="white" stroke-width="6" fill="none"/>
</svg>
<span>Haptic Air</span>
</div>

<div onclick="toggleTheme()" style="cursor:pointer;">Toggle Theme</div>
</header>

<div class="main">

<div class="card">

<h2>Bluetooth Driver 5.4</h2>
<div class="small">⭐ 4.8 • 1,245,221 downloads</div>

<div class="os-select">
<button class="active" onclick="selectOS(this)">Windows</button>
<button onclick="selectOS(this)">macOS</button>
<button onclick="selectOS(this)">Linux</button>
<button onclick="selectOS(this)">Android</button>
<button onclick="selectOS(this)">iOS</button>
</div>

<button class="download-btn" onclick="start()">Download</button>

<div class="small" id="fileInfo">File: HapticAir_5.4_Setup.exe</div>

<div class="progress-box" id="progressBox">
<div class="bar"><div class="fill" id="fill"></div></div>
<p id="status">Starting...</p>
<p class="small" id="note"></p>
</div>

<hr>

<h3>Release Notes</h3>
<ul class="small">
<li>Improved Bluetooth stability</li>
<li>Reduced latency by 35%</li>
<li>New mobile companion support</li>
</ul>

</div>

<div class="card">
<div class="ad">
🚀 Upgrade to Pro<br>
Ultra Low Latency • Smart Pairing
</div>
</div>

</div>

<script>
let os="Windows";

function toggleTheme(){
document.body.classList.toggle("light");
}

function selectOS(btn){
document.querySelectorAll(".os-select button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
os=btn.innerText;

const file=document.getElementById("fileInfo");

if(os==="Windows") file.innerText="File: HapticAir_5.4_Setup.exe";
else if(os==="macOS") file.innerText="File: HapticAir_5.4.dmg";
else if(os==="Linux") file.innerText="File: hapticair_5.4.tar.gz";
else if(os==="Android") file.innerText="File: hapticair_5.4.apk";
else if(os==="iOS") file.innerText="File: hapticair_mobile_profile.mobileconfig";
}

function start(){
const box=document.getElementById("progressBox");
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const note=document.getElementById("note");

box.style.display="block";

let p=0;

if(os==="iOS"){
note.innerText="iOS uses a companion app (simulation)";
}else if(os==="Android"){
note.innerText="Installing APK may require permissions";
}else{
note.innerText="";
}

const interval=setInterval(()=>{
p+=Math.random()*10;
if(p>100)p=100;

fill.style.width=p+"%";

if(p<30) status.innerText="Connecting...";
else if(p<60) status.innerText="Downloading...";
else if(p<90) status.innerText="Verifying...";
else status.innerText="Finishing...";

if(p===100){
clearInterval(interval);
status.innerText="Completed (simulation only)";
}
},300);
}
</script>

</body>
</html>
